# =============================================================================
# Kannari Music Academy — Production Docker Compose
# =============================================================================
# Persistent data:
#   postgres_data  — PostgreSQL database files  (NEVER delete this volume)
#   media_data     — User-uploaded files (images, audio, video)
#
# Useful commands:
#   docker compose build --no-cache          # full image rebuild
#   docker compose up -d                     # start / update services
#   docker compose logs -f --tail=100 <svc>  # tail logs
#   docker compose exec backend python manage.py createsuperuser
# =============================================================================

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: always                          # DB must always restart
    environment:
      POSTGRES_DB:       kannari_db
      POSTGRES_USER:     kannari_user
      POSTGRES_PASSWORD: kannari_secure_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kannari_user -d kannari_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── Django / Gunicorn ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env                       # all secrets live here only
    volumes:
      - media_data:/app/media
    networks:
      - backend_net                          # reach the DB
      - app_net                              # reached by nginx
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8000)); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # ── React / Nginx (SPA) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_STRIPE_PUBLISHABLE_KEY: ${REACT_APP_STRIPE_PUBLISHABLE_KEY}
    restart: unless-stopped
    networks:
      - app_net
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/ssl/letsencrypt/www:/var/www/certbot:ro
      - media_data:/app/media:ro             # serve uploads without hitting backend
    networks:
      - app_net
      - jitsi_net
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      jitsi-web:
        condition: service_started
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Jitsi — Web ─────────────────────────────────────────────────────────────
  jitsi-web:
    image: jitsi/web:stable
    restart: unless-stopped
    env_file:
      - ./jitsi/.env
    environment:
      - XMPP_SERVER=jitsi-prosody
      - XMPP_BOSH_URL_BASE=http://jitsi-prosody:5280
    expose:
      - "80"
    volumes:
      - jitsi_web_config:/config
    networks:
      - jitsi_net
    depends_on:
      - jitsi-prosody
      - jitsi-jicofo
      - jitsi-jvb
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  # ── Jitsi — XMPP / Prosody ──────────────────────────────────────────────────
  jitsi-prosody:
    image: jitsi/prosody:stable
    restart: unless-stopped
    env_file:
      - ./jitsi/.env
    expose:
      - "5222"
      - "5280"
      - "5347"
    volumes:
      - jitsi_prosody_config:/config
    networks:
      - jitsi_net
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  # ── Jitsi — Jicofo (conference focus) ───────────────────────────────────────
  jitsi-jicofo:
    image: jitsi/jicofo:stable
    restart: unless-stopped
    env_file:
      - ./jitsi/.env
    environment:
      - XMPP_SERVER=jitsi-prosody
    volumes:
      - jitsi_jicofo_config:/config
    networks:
      - jitsi_net
    depends_on:
      - jitsi-prosody
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  # ── Jitsi — JVB (video bridge) ──────────────────────────────────────────────
  jitsi-jvb:
    image: jitsi/jvb:stable
    restart: unless-stopped
    env_file:
      - ./jitsi/.env
    environment:
      - XMPP_SERVER=jitsi-prosody
      - XMPP_BOSH_URL_BASE=http://jitsi-prosody:5280
    ports:
      - "10000:10000/udp"
      - "127.0.0.1:4443:4443"
    volumes:
      - jitsi_jvb_config:/config
    networks:
      - jitsi_net
    depends_on:
      - jitsi-prosody
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

# =============================================================================
# Volumes — persistent data (never rename these)
# =============================================================================
volumes:
  postgres_data:        # PostgreSQL data files
  media_data:           # User-uploaded media (images, audio, video)
  jitsi_web_config:
  jitsi_prosody_config:
  jitsi_jicofo_config:
  jitsi_jvb_config:

# =============================================================================
# Networks — service isolation
#   app_net      nginx ↔ frontend ↔ backend
#   backend_net  backend ↔ db  (DB unreachable from nginx/frontend)
#   jitsi_net    nginx ↔ all jitsi services
# =============================================================================
networks:
  app_net:
    driver: bridge
  backend_net:
    driver: bridge
  jitsi_net:
    driver: bridge

